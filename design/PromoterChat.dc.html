<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promoter app — Chats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,a{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #111111;outline-offset:3px}
.bpop{animation:bpop .55s cubic-bezier(.2,1.4,.4,1) both}
.bfall{animation:bfall 1.4s ease-out both}
@keyframes bpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bfall{0%{opacity:0;translate:0 -40px}100%{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #111111; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font: 700 30px Archivo, sans-serif; letter-spacing: -0.035em">Chats</h1>
    <div style="display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: #F3F2EE">
      <button onClick="{{showTeam}}" style="flex: 1; height: 40px; border-radius: 999px; border: 0; background: {{teamBg}}; box-shadow: {{teamShadow}}; font: 600 13px 'Instrument Sans', sans-serif; color: #111111; cursor: pointer">Team · 44 Toronto</button>
      <button onClick="{{showGuests}}" style="flex: 1; height: 40px; border-radius: 999px; border: 0; background: {{guestBg}}; box-shadow: {{guestShadow}}; font: 600 13px 'Instrument Sans', sans-serif; color: #111111; cursor: pointer">Guests · 2 new</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: #111111; color: #FFFFFF">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="2" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 6 3 3H6l3-3z"/></svg>
      <span style="font: 500 13px 'Instrument Sans', sans-serif">{{pinned}}</span>
    </div>
  </div>

  <div style="flex: 1; padding: 6px 16px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 3px; align-self: {{m.align}}; max-width: 82%; padding: 10px 14px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}">
        <span style="font: 600 12px 'Instrument Sans', sans-serif; opacity: 0.7">{{m.who}}</span>
        <span style="font: 400 14px/1.4 'Instrument Sans', sans-serif">{{m.text}}</span>
      </div>
    </sc-for>
    <sc-if value="{{showCard}}" hint-placeholder-val="{{ false }}">
      <div style="align-self: flex-end; width: 240px; padding: 14px; border-radius: 20px; border: 2px solid #111111; display: flex; flex-direction: column; gap: 6px">
        <span style="font: 600 11px 'Instrument Sans', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #5E5D58">Offer sent</span>
        <span style="font: 800 26px Archivo, sans-serif; letter-spacing: -0.03em">$1,850</span>
        <span style="font: 400 13px 'Instrument Sans', sans-serif; color: #333331">Main VIP · 6 guests · bottle upgrade</span>
      </div>
    </sc-if>
  </div>

  <div style="padding: 10px 16px 30px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #EEECE6">
    <div style="display: flex; gap: 8px">
      <button onClick="{{sendCard}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9D6CC; background: #FFFFFF; font: 600 12px 'Instrument Sans', sans-serif; color: #111111; cursor: pointer">+ Offer card</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9D6CC; background: #FFFFFF; font: 600 12px 'Instrument Sans', sans-serif; color: #111111">Hold a table</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D9D6CC; background: #FFFFFF; font: 600 12px 'Instrument Sans', sans-serif; color: #111111">Guest list</button>
    </div>
    <div style="display: flex; gap: 6px; overflow: hidden">
      <span style="font: 600 11px 'Instrument Sans', sans-serif; letter-spacing: 0.06em; color: #5E5D58; align-self: center; white-space: nowrap">QUICK REPLY</span>
      <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: #F3F2EE; font: 500 12px 'Instrument Sans', sans-serif; color: #111111; white-space: nowrap">Side door at 11 ✓</button>
      <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: #F3F2EE; font: 500 12px 'Instrument Sans', sans-serif; color: #111111; white-space: nowrap">Dress code: upscale</button>
      <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: #F3F2EE; font: 500 12px 'Instrument Sans', sans-serif; color: #111111; white-space: nowrap">Bring ID</button>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 6px 0 16px; border-radius: 999px; background: #F3F2EE">
      <span style="position: absolute; left: -9999px">Message</span>
      <input placeholder="Message" style="flex: 1; border: 0; background: transparent; outline: none; font: 400 15px 'Instrument Sans', sans-serif; color: #111111">
      <button aria-label="Send" style="width: 38px; height: 38px; border-radius: 50%; border: 0; background: #111111; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </label>
    <a href="PromoterApp.dc.html" style="align-self: center; font: 500 13px 'Instrument Sans', sans-serif; color: #5E5D58">Back to requests</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'team', card: false };
  }
  renderVals() {
    const team = [
      { who: 'Dev S.', text: 'I’m on the DJ-side 10-top, they booked with me in Oct.' },
      { who: 'Maya R.', text: 'My 4-top booth guests just confirmed, holding B3.' },
      { who: 'You', text: 'My VIP 6-top offered 1,800 — OK to counter 1,850 with a bottle upgrade?', mine: true },
      { who: 'Alex (owner)', text: 'Approved. Keep Main VIP above 1,750 tonight.' }
    ];
    const guests = [
      { who: 'Priya · party of 6', text: 'Is the bottle upgrade Grey Goose or Belvedere?' },
      { who: 'You', text: 'Your pick. I’ll meet you at the side door at 11.', mine: true },
      { who: 'Priya · party of 6', text: 'Perfect, accepting now.' }
    ];
    const isTeam = this.state.tab === 'team';
    return {
      msgs: (isTeam ? team : guests).map((m) => ({
        who: m.who, text: m.text,
        align: m.mine ? 'flex-end' : 'flex-start',
        bg: m.mine ? '#111111' : '#F3F2EE',
        fg: m.mine ? '#FFFFFF' : '#111111',
        radius: m.mine ? '18px 18px 4px 18px' : '18px 18px 18px 4px'
      })),
      pinned: isTeam ? 'Owner: Main VIP floor is $1,750 tonight' : 'Priya’s party · Main VIP · offer $1,800',
      teamBg: isTeam ? '#FFFFFF' : 'transparent',
      guestBg: isTeam ? 'transparent' : '#FFFFFF',
      teamShadow: isTeam ? '0 2px 8px rgba(0,0,0,0.08)' : 'none',
      guestShadow: isTeam ? 'none' : '0 2px 8px rgba(0,0,0,0.08)',
      showTeam: () => this.setState({ tab: 'team' }),
      showGuests: () => this.setState({ tab: 'guests' }),
      showCard: this.state.card,
      sendCard: () => this.setState({ card: true })
    };
  }
}
</script>
</body>
</html>
