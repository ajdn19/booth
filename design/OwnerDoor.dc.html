<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owner app — Door check-in tonight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,a{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #111111;outline-offset:3px}
.bpop{animation:bpop .55s cubic-bezier(.2,1.4,.4,1) both}
.bfall{animation:bfall 1.4s ease-out both}
@keyframes bpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bfall{0%{opacity:0;translate:0 -40px}100%{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111111; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="OwnerApp.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #2A2A28; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
      <span style="display: flex; align-items: center; gap: 6px; font: 600 12px 'Instrument Sans', sans-serif; color: #CFCDC6"><span style="width: 7px; height: 7px; border-radius: 50%; background: #C8FF3D"></span>Door · 11:42pm</span>
    </div>
    <h1 style="margin: 0; font: 800 30px/1 Archivo, sans-serif; letter-spacing: -0.035em">Tonight at the door</h1>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 10px 12px; border-radius: 16px; background: #2A2A28; display: flex; flex-direction: column; gap: 2px"><span style="font: 800 22px Archivo, sans-serif">{{arrived}}</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #CFCDC6">tables in</span></div>
      <div style="padding: 10px 12px; border-radius: 16px; background: #2A2A28; display: flex; flex-direction: column; gap: 2px"><span style="font: 800 22px Archivo, sans-serif">{{late}}</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #CFCDC6">running late</span></div>
      <div style="padding: 10px 12px; border-radius: 16px; background: #2A2A28; display: flex; flex-direction: column; gap: 2px"><span style="font: 800 22px Archivo, sans-serif">{{guests}}</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #CFCDC6">guests scanned</span></div>
    </div>
  </div>

  <div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="padding: 12px 14px; border-radius: 18px; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; gap: 12px">
        <span style="width: 48px; height: 40px; border-radius: 12px; background: {{r.chipBg}}; color: {{r.chipFg}}; display: flex; align-items: center; justify-content: center; font: 700 13px Archivo, sans-serif">{{r.id}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font: 600 14px 'Instrument Sans', sans-serif">{{r.name}}</span><span style="font: 400 12px 'Instrument Sans', sans-serif; opacity: 0.8">{{r.sub}}</span></span>
        <sc-if value="{{r.canRelease}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{r.release}}" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: #FFFFFF; color: #111111; font: 600 12px 'Instrument Sans', sans-serif; cursor: pointer">Release</button>
        </sc-if>
        <sc-if value="{{r.showBadge}}" hint-placeholder-val="{{ true }}">
          <span style="font: 600 12px 'Instrument Sans', sans-serif">{{r.badge}}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 20px 28px">
    <button style="width: 100%; height: 60px; border-radius: 999px; border: 0; background: #C8FF3D; color: #111111; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 16px 'Instrument Sans', sans-serif"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>Scan a table pass</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { released: false };
  }
  renderVals() {
    const rel = this.state.released;
    const rows = [
      { id: 'V1', name: 'Dev S. · party of 10', sub: 'Arrived 11:05 · 10 of 10 scanned', st: 'in', n: 10 },
      { id: 'B1', name: 'Jordan K. · party of 6', sub: 'Arrived 11:12 · 6 of 6 scanned', st: 'in', n: 6 },
      { id: 'V2', name: 'Maya R. · Max K., party of 6', sub: 'Arrived 11:31 · 5 of 6 scanned', st: 'in', n: 5 },
      { id: 'B3', name: 'Maya R. · party of 4', sub: 'Due 11:30 · 12 min late, not answering', st: rel ? 'released' : 'late', n: 0 },
      { id: 'D1', name: 'Tay N. · party of 8', sub: 'Due 12:00', st: 'due', n: 0 }
    ];
    const style = {
      in: ['#2A2A28', '#FFFFFF', '#C8FF3D', '#111111', 'In ✓'],
      late: ['#FFFFFF', '#111111', '#111111', '#FFFFFF', ''],
      released: ['#2A2A28', '#CFCDC6', '#3A3A36', '#CFCDC6', 'Back on sale'],
      due: ['#2A2A28', '#FFFFFF', '#3A3A36', '#FFFFFF', 'Expected']
    };
    return {
      rows: rows.map((r) => {
        const s = style[r.st];
        return {
          id: r.id, name: r.name, sub: r.st === 'released' ? 'Released at 11:43 · offered to the waitlist' : r.sub,
          bg: s[0], fg: s[1], chipBg: s[2], chipFg: s[3], badge: s[4],
          canRelease: r.st === 'late', showBadge: r.st !== 'late',
          release: () => this.setState({ released: true })
        };
      }),
      arrived: '3 / 5',
      late: rel ? 0 : 1,
      guests: rows.reduce((a, r) => a + r.n, 0)
    };
  }
}
</script>
</body>
</html>
