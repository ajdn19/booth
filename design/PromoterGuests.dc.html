<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promoter app — My guests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,a{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #111111;outline-offset:3px}
.bpop{animation:bpop .55s cubic-bezier(.2,1.4,.4,1) both}
.bfall{animation:bfall 1.4s ease-out both}
@keyframes bpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bfall{0%{opacity:0;translate:0 -40px}100%{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #111111; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font: 800 28px Archivo, sans-serif; letter-spacing: -0.03em">My guests</h1>
      <span style="font: 500 13px 'Instrument Sans', sans-serif; color: #5E5D58">186 people</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 16px; background: #F3F2EE">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5D58" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span style="position: absolute; left: -9999px">Search guests</span>
      <input placeholder="Search name or phone" style="flex: 1; border: 0; background: transparent; outline: none; font: 400 15px 'Instrument Sans', sans-serif; color: #111111">
    </label>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font: 600 13px 'Instrument Sans', sans-serif; white-space: nowrap; cursor: pointer">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
    <sc-for list="{{guests}}" as="g" hint-placeholder-count="5">
      <div style="padding: 10px 14px; border-radius: 20px; background: #F3F2EE; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 42px; height: 42px; border-radius: 50%; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 700 13px Archivo, sans-serif">{{g.initials}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font: 600 15px 'Instrument Sans', sans-serif">{{g.name}}</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #5E5D58">{{g.meta}}</span></span>
          <span style="font: 800 17px Archivo, sans-serif">{{g.spend}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="height: 24px; padding: 0 9px; border-radius: 999px; background: {{g.tagBg}}; display: flex; align-items: center; font: 600 11px 'Instrument Sans', sans-serif">{{g.tag}}</span>
          <a href="PromoterChat.dc.html" style="height: 34px; padding: 0 14px; border-radius: 999px; background: #111111; color: #FFFFFF; display: flex; align-items: center; font: 600 12px 'Instrument Sans', sans-serif">{{g.action}}</a>
        </div>
      </div>
    </sc-for>
  </div>

  <nav style="display: flex; justify-content: space-around; align-items: center; height: 84px; padding-bottom: 18px; box-sizing: border-box; border-top: 1px solid #E4E2DC; background: #FFFFFF">
    <a href="PromoterApp.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px 'Instrument Sans', sans-serif; color: #5E5D58; min-width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 3 4 14h7l-1 7 9-11h-7z"/></svg>Requests</a>
    <a href="PromoterGuests.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 11px 'Instrument Sans', sans-serif; color: #111111; min-width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.5 4.5 4"/></svg>Guests</a>
    <a href="PromoterChat.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px 'Instrument Sans', sans-serif; color: #5E5D58; min-width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16v10H8l-4 4z"/></svg>Chats</a>
    <a href="PromoterEarnings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px 'Instrument Sans', sans-serif; color: #5E5D58; min-width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v18M17 7H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H7"/></svg>Earnings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const all = [
      { initials: 'PM', name: 'Priya M.', meta: '12 nights · last Nov 14', spend: '$9,840', tag: 'Regular', kinds: ['reg', 'big'], action: 'Invite to Sat' },
      { initials: 'DW', name: 'Daniel W.', meta: '4 nights · birthday Dec 2', spend: '$6,200', tag: 'Birthday soon', kinds: ['bday', 'big'], action: 'Send birthday offer' },
      { initials: 'LC', name: 'Lena C.', meta: '7 nights · last Oct 31', spend: '$4,150', tag: 'Regular', kinds: ['reg'], action: 'Invite to Sat' },
      { initials: 'OA', name: 'Omar A.', meta: '2 nights · last Sep 19', spend: '$3,900', tag: 'Big spender', kinds: ['big'], action: 'Message' },
      { initials: 'SG', name: 'Sofia G.', meta: '1 night · birthday Dec 9', spend: '$900', tag: 'Birthday soon', kinds: ['bday'], action: 'Send birthday offer' }
    ];
    const filters = [['all', 'All'], ['reg', 'Regulars'], ['bday', 'Birthdays'], ['big', 'Big spenders']];
    const f = this.state.filter;
    const list = f === 'all' ? all : all.filter((g) => g.kinds.indexOf(f) >= 0);
    return {
      filters: filters.map(([id, label]) => ({ label: label, border: id === f ? '1.5px solid #111111' : '1px solid #E4E2DC', bg: id === f ? '#111111' : '#FFFFFF', fg: id === f ? '#FFFFFF' : '#111111', pick: () => this.setState({ filter: id }) })),
      guests: list.map((g) => ({ initials: g.initials, name: g.name, meta: g.meta, spend: g.spend, tag: g.tag, action: g.action, tagBg: g.tag === 'Birthday soon' ? '#C8FF3D' : '#FFFFFF' }))
    };
  }
}
</script>
</body>
</html>
