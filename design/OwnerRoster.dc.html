<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owner app — Promoter schedule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,a{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #111111;outline-offset:3px}
.bpop{animation:bpop .55s cubic-bezier(.2,1.4,.4,1) both}
.bfall{animation:bfall 1.4s ease-out both}
@keyframes bpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bfall{0%{opacity:0;translate:0 -40px}100%{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F2EE; color: #111111; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="OwnerTeam.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
      <div style="display: flex; flex-direction: column"><span style="font: 400 13px 'Instrument Sans', sans-serif; color: #5E5D58">44 Toronto</span><h1 style="margin: 0; font: 800 26px Archivo, sans-serif; letter-spacing: -0.03em">Promoter schedule</h1></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #111111; color: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8FF3D" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span style="font: 400 13px/1.35 'Instrument Sans', sans-serif">Guests only see the promoters you schedule, or the host team on event nights.</span>
    </div>
  </div>

  <div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="padding: 12px 14px; border-radius: 22px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font: 700 16px Archivo, sans-serif">{{r.label}}</span><span style="font: 500 12px 'Instrument Sans', sans-serif; color: {{r.noteColor}}">{{r.note}}</span></span>
          <button onClick="{{r.flip}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #D9D6CC; background: #FFFFFF; color: #111111; font: 600 12px 'Instrument Sans', sans-serif; cursor: pointer; white-space: nowrap">{{r.flipLabel}}</button>
        </div>
        <sc-if value="{{r.inHouse}}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{r.chips}}" as="c" hint-placeholder-count="4">
              <button onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="height: 40px; border-radius: 14px; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; gap: 4px; font: 600 13px 'Instrument Sans', sans-serif; cursor: pointer">{{c.name}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{r.handed}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #111111; color: #FFFFFF">
            <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #C8FF3D; color: #111111; display: flex; align-items: center; font: 700 10px 'Instrument Sans', sans-serif; letter-spacing: 0.06em">HOST</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font: 600 13px 'Instrument Sans', sans-serif">{{r.host}}</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #CFCDC6">{{r.hostSub}}</span></span>
            <a href="OwnerHostDeal.dc.html" style="height: 30px; padding: 0 10px; border-radius: 999px; background: #2A2A28; display: flex; align-items: center; font: 600 12px 'Instrument Sans', sans-serif; white-space: nowrap">Terms ›</a>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 20px 28px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font: 400 13px 'Instrument Sans', sans-serif; color: #5E5D58; text-align: center">{{footNote}}</span>
    <button onClick="{{publish}}" style="height: 54px; border-radius: 999px; border: 0; background: #111111; color: #FFFFFF; font: 600 15px 'Instrument Sans', sans-serif; cursor: pointer">{{publishLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      roster: { fri27: ['JK', 'TN'], sat28: ['MR', 'JK', 'DS'], fri4: ['MR', 'TN'], sat5: ['MR', 'JK', 'DS', 'TN'] },
      handoff: { fri4: { host: 'Commerce Society', event: 'Winter Formal', reps: 2 }, sat5: { host: 'Lumen Events', event: 'AFTERGLOW', reps: 3 } },
      published: false
    };
  }
  renderVals() {
    const days = [['fri27', 'Fri Nov 27', 8], ['sat28', 'Sat Nov 28', 14], ['fri4', 'Fri Dec 4', 8], ['sat5', 'Sat Dec 5', 14]];
    const people = [['MR', 'Maya'], ['JK', 'Jordan'], ['DS', 'Dev'], ['TN', 'Tay']];
    const roster = this.state.roster;
    return {
      rows: days.map(([id, label, tables]) => {
        const list = roster[id];
        const n = list.length;
        const h = this.state.handoff[id];
        const handoff = this.state.handoff;
        return {
          label: label,
          inHouse: !h,
          handed: !!h,
          host: h ? h.host + ' · ' + h.event : '',
          hostSub: h ? h.reps + ' table reps sell all ' + tables + ' tables' : '',
          flipLabel: h ? 'Take back night' : 'Hand to event host',
          flip: () => {
            const next = Object.assign({}, handoff);
            if (h) { delete next[id]; } else { next[id] = { host: 'New host · invite sent', event: 'Private event', reps: 0 }; }
            this.setState({ handoff: next, published: false });
          },
          note: h ? 'Event takeover' : n === 0 ? 'No one scheduled' : n + ' on · ' + tables + ' tables',
          noteColor: h ? '#111111' : n === 0 ? '#B3261E' : '#5E5D58',
          chips: people.map(([pid, name]) => {
            const on = list.indexOf(pid) >= 0;
            return {
              name: name,
              pressed: on ? 'true' : 'false',
              border: on ? '2px solid #111111' : '1px dashed #B5B2A8',
              bg: on ? '#111111' : '#FFFFFF',
              fg: on ? '#FFFFFF' : '#5E5D58',
              toggle: () => {
                const next = on ? list.filter((x) => x !== pid) : list.concat([pid]);
                this.setState({ roster: Object.assign({}, roster, { [id]: next }), published: false });
              }
            };
          })
        };
      }),
      footNote: this.state.published ? 'Live — guests and promoters can see this schedule.' : 'Tap a name to schedule them, or hand a night to an event host.',
      publishLabel: this.state.published ? 'Schedule published' : 'Publish schedule',
      publish: () => this.setState({ published: true })
    };
  }
}
</script>
</body>
</html>
