<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My requests tonight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,a{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #111111;outline-offset:3px}
.bpop{animation:bpop .55s cubic-bezier(.2,1.4,.4,1) both}
.bfall{animation:bfall 1.4s ease-out both}
@keyframes bpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bfall{0%{opacity:0;translate:0 -40px}100%{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F2EE; color: #111111; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Offer.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: #FFFFFF; font: 600 13px 'Instrument Sans', sans-serif; color: #111111">Sat Nov 28 ▾</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font: 700 32px/1.02 Archivo, sans-serif; letter-spacing: -0.04em">My requests</h1>
      <span style="font: 400 14px 'Instrument Sans', sans-serif; color: #5E5D58">{{headline}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{counts}}" as="c" hint-placeholder-count="4">
        <div style="padding: 8px 6px; border-radius: 14px; background: {{c.bg}}; color: {{c.fg}}; display: flex; flex-direction: column; gap: 2px; align-items: center"><span style="font: 800 20px Archivo, sans-serif">{{c.n}}</span><span style="font: 500 11px 'Instrument Sans', sans-serif; text-align: center">{{c.label}}</span></div>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{reqs}}" as="r" hint-placeholder-count="4">
      <div style="padding: 12px 14px; border-radius: 22px; background: #FFFFFF; opacity: {{r.opacity}}; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 44px; height: 44px; border-radius: 14px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 800 11px Archivo, sans-serif; flex-shrink: 0">{{r.mark}}</span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 15px 'Instrument Sans', sans-serif">{{r.club}}</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #5E5D58">{{r.detail}}</span></div>
          <span class="bpop" style="height: 26px; padding: 0 10px; border-radius: 999px; background: {{r.pillBg}}; color: {{r.pillFg}}; display: flex; align-items: center; font: 600 11px 'Instrument Sans', sans-serif; white-space: nowrap">{{r.status}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
          <span style="font: 400 13px/1.38 'Instrument Sans', sans-serif; color: #333331"><span style="display: inline-flex; align-items: center; gap: 3px; margin-right: 4px; vertical-align: -2px; font: 600 11px 'Instrument Sans', sans-serif; letter-spacing: 0.04em; text-transform: uppercase; color: #111111"><svg width="13" height="13" viewBox="0 0 24 24" fill="#111111" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>AI</span>{{r.note}}</span>
          <sc-if value="{{r.canAccept}}" hint-placeholder-val="{{ false }}">
            <button onClick="{{r.accept}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #111111; color: #FFFFFF; font: 600 13px 'Instrument Sans', sans-serif; white-space: nowrap; cursor: pointer">Accept {{r.price}}</button>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 10px 20px 28px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font: 400 13px 'Instrument Sans', sans-serif; color: #5E5D58; text-align: center">{{footNote}}</span>
    <a href="Main.dc.html" style="height: 54px; border-radius: 999px; border: 1.5px solid #111111; display: flex; align-items: center; justify-content: center; font: 600 15px 'Instrument Sans', sans-serif">+ Request another club</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { confirmed: false };
  }
  renderVals() {
    const done = this.state.confirmed;
    const base = [
      { mark: '44', club: '44 Toronto', detail: 'Main VIP V2 · with Maya R. · offered $1,800', status: 'In discussion', note: 'Maya can do $1,850 with a bottle upgrade and entry before midnight. Needs a yes by 11:45.', price: '$1,850', canAccept: true },
      { mark: 'REBEL', club: 'Rebel', detail: 'Mezzanine table · with Dev S. · offered $1,100', status: 'In discussion', note: 'Dev thinks the mezzanine works and will confirm a riser table after 10pm.', canAccept: false },
      { mark: 'TOYBOX', club: 'Toybox', detail: 'Booth · with Jordan K. · offered $650', status: 'Sent out', note: 'No reply from Jordan yet. He usually answers in about 10 min.', canAccept: false },
      { mark: 'EFS', club: 'EFS', detail: 'Booth · offered $700', status: 'Cancelled', note: 'Club says the night is sold out. Nothing left to do here.', canAccept: false }
    ];
    const list = base.map((r, i) => {
      if (!done) return r;
      if (i === 0) return Object.assign({}, r, { status: 'Confirmed', note: 'Locked at $1,850, deposit paid. Maya meets you at the side door at 11.', canAccept: false });
      if (r.status === 'Cancelled') return r;
      return Object.assign({}, r, { status: 'Cancelled', note: 'Withdrawn automatically when you confirmed 44 Toronto.' });
    });
    const style = {
      'Sent out': ['#EEECE6', '#111111'],
      'In discussion': ['#111111', '#FFFFFF'],
      'Confirmed': ['#C8FF3D', '#111111'],
      'Cancelled': ['#F3F2EE', '#5E5D58']
    };
    const count = (s) => list.filter((r) => r.status === s).length;
    return {
      headline: done ? '44 Toronto is confirmed for Saturday.' : '4 clubs, one night. Pick the one that feels right.',
      counts: ['Sent out', 'In discussion', 'Confirmed', 'Cancelled'].map((s) => ({
        n: count(s), label: s,
        bg: s === 'Confirmed' && count(s) ? '#C8FF3D' : '#FFFFFF',
        fg: '#111111'
      })),
      reqs: list.map((r) => ({
        mark: r.mark, club: r.club, detail: r.detail, status: r.status, note: r.note, price: r.price,
        canAccept: !!r.canAccept,
        pillBg: style[r.status][0], pillFg: style[r.status][1],
        opacity: '1',
        accept: () => this.setState({ confirmed: true })
      })),
      footNote: done ? 'Other open requests were withdrawn for you.' : 'AI summaries come from your chats. Confirming one club withdraws the rest.'
    };
  }
}
</script>
</body>
</html>
