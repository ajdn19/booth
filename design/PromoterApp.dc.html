<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promoter app — Requests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,a{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #111111;outline-offset:3px}
.bpop{animation:bpop .55s cubic-bezier(.2,1.4,.4,1) both}
.bfall{animation:bfall 1.4s ease-out both}
@keyframes bpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bfall{0%{opacity:0;translate:0 -40px}100%{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F2EE; color: #111111; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 18px; background: #111111; color: #FFFFFF; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font: 400 13px 'Instrument Sans', sans-serif; color: #CFCDC6">44 Toronto · Sat Nov 28</span><span style="font: 700 24px Archivo, sans-serif; letter-spacing: -0.03em">Hey Jordan</span></div>
      <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: #C8FF3D; color: #111111; font: 600 12px 'Instrument Sans', sans-serif"><span style="width: 6px; height: 6px; border-radius: 50%; background: #111111"></span>On shift</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 10px 12px; border-radius: 16px; background: #2A2A28; display: flex; flex-direction: column; gap: 2px"><span style="font: 700 18px Archivo, sans-serif">2</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #CFCDC6">tables closed</span></div>
      <div style="padding: 10px 12px; border-radius: 16px; background: #2A2A28; display: flex; flex-direction: column; gap: 2px"><span style="font: 700 18px Archivo, sans-serif">$275</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #CFCDC6">your commission</span></div>
      <div style="padding: 10px 12px; border-radius: 16px; background: #2A2A28; display: flex; flex-direction: column; gap: 2px"><span style="font: 700 18px Archivo, sans-serif">#4</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #CFCDC6">on the team</span></div>
    </div>
  </div>

  <div style="flex: 1; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px"><h1 style="margin: 0; font: 700 22px Archivo, sans-serif; letter-spacing: -0.02em">Requests sent to you</h1><span style="font: 500 12px 'Instrument Sans', sans-serif; color: #5E5D58">VIP floor $1,750</span></div>
    <sc-for list="{{requests}}" as="r" hint-placeholder-count="3">
      <div style="padding: 14px; border-radius: 22px; background: #FFFFFF; border: {{r.border}}; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: flex-start">
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="font: 600 15px 'Instrument Sans', sans-serif">{{r.title}}</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #5E5D58">{{r.sub}}</span></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font: 800 22px Archivo, sans-serif; letter-spacing: -0.03em">{{r.offer}}</span><span style="font: 400 12px 'Instrument Sans', sans-serif; color: #5E5D58">list {{r.list}}</span></div>
        </div>
        <span style="font: 500 12px 'Instrument Sans', sans-serif; color: {{r.statusColor}}">{{r.status}}</span>
        <div style="display: flex; gap: 8px">
          <button onClick="{{r.counter}}" style="flex: 1; height: 44px; border-radius: 999px; border: 1px solid #D9D6CC; background: #FFFFFF; color: #111111; font: 600 14px 'Instrument Sans', sans-serif; cursor: pointer">Counter {{r.counterPrice}}</button>
          <button onClick="{{r.accept}}" style="flex: 1; height: 44px; border-radius: 999px; border: 0; background: #111111; color: #FFFFFF; font: 600 14px 'Instrument Sans', sans-serif; cursor: pointer">Accept</button>
        </div>
      </div>
    </sc-for>
  </div>

  <nav style="display: flex; justify-content: space-around; align-items: center; height: 84px; padding-bottom: 18px; box-sizing: border-box; border-top: 1px solid #E4E2DC; background: #FFFFFF">
    <a href="PromoterApp.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 11px 'Instrument Sans', sans-serif; color: #111111; min-width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 3 4 14h7l-1 7 9-11h-7z"/></svg>Requests</a>
    <a href="PromoterGuests.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px 'Instrument Sans', sans-serif; color: #5E5D58; min-width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.5 4.5 4"/></svg>Guests</a>
    <a href="PromoterChat.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px 'Instrument Sans', sans-serif; color: #5E5D58; min-width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16v10H8l-4 4z"/></svg>Chats</a>
    <a href="PromoterEarnings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 11px 'Instrument Sans', sans-serif; color: #5E5D58; min-width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v18M17 7H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H7"/></svg>Earnings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { acted: {} };
  }
  renderVals() {
    const reqs = [
      { id: 'a', title: 'Party of 6 · Main VIP', sub: '11pm · birthday · picked you', offer: '$1,800', list: '$2,000', counterPrice: '$1,850', status: 'Expires in 8 min' },
      { id: 'b', title: 'Party of 10 · DJ side', sub: '11:30pm · repeat guest', offer: '$3,600', list: '$4,000', counterPrice: '$3,800', status: 'New · 1 min ago' },
      { id: 'c', title: 'Party of 4 · Booth', sub: '10:45pm · first visit', offer: '$750', list: '$900', counterPrice: '$825', status: 'Waiting on your reply' }
    ];
    const acted = this.state.acted;
    return {
      requests: reqs.map((r) => {
        const a = acted[r.id];
        return {
          title: r.title, sub: r.sub, offer: r.offer, list: r.list, counterPrice: r.counterPrice,
          status: a === 'accept' ? 'You landed this table' : a === 'counter' ? 'You countered ' + r.counterPrice + ' · waiting on guest' : r.status,
          statusColor: a ? '#111111' : '#5E5D58',
          border: a === 'accept' ? '2px solid #C8FF3D' : a === 'counter' ? '2px solid #111111' : '2px solid transparent',
          counter: () => this.setState({ acted: Object.assign({}, acted, { [r.id]: 'counter' }) }),
          accept: () => this.setState({ acted: Object.assign({}, acted, { [r.id]: 'accept' }) })
        };
      })
    };
  }
}
</script>
</body>
</html>
