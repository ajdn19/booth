<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table pass and guest list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,a{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #111111;outline-offset:3px}
.bpop{animation:bpop .55s cubic-bezier(.2,1.4,.4,1) both}
.bfall{animation:bfall 1.4s ease-out both}
@keyframes bpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bfall{0%{opacity:0;translate:0 -40px}100%{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F2EE; color: #111111; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 20px 12px; display: flex; align-items: center; gap: 12px">
    <a href="Split.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font: 800 26px Archivo, sans-serif; letter-spacing: -0.03em">Your table pass</h1>
  </div>

  <div style="flex: 1; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="border-radius: 26px; background: #111111; color: #FFFFFF; overflow: hidden">
      <div style="padding: 16px 18px; display: flex; gap: 16px; align-items: center">
        <div style="width: 118px; height: 118px; padding: 8px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; display: grid; grid-template-columns: repeat(17, minmax(0, 1fr)); flex-shrink: 0" role="img" aria-label="Table check-in QR code">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="289"><span style="background: {{c}}; aspect-ratio: 1"></span></sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font: 800 26px/0.95 Archivo, sans-serif; letter-spacing: -0.04em">44 TORONTO</span>
          <span style="font: 400 13px 'Instrument Sans', sans-serif; color: #CFCDC6">Sat Nov 28 · V2 Main VIP</span>
          <span class="bpop" style="align-self: flex-start; height: 26px; padding: 0 10px; border-radius: 999px; background: #C8FF3D; color: #111111; display: flex; align-items: center; font: 600 11px 'Instrument Sans', sans-serif">Locked in</span>
        </div>
      </div>
      <div style="border-top: 1px dashed #4A4A46; padding: 12px 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font: 400 12px 'Instrument Sans', sans-serif; color: #CFCDC6">
        <span><span style="display: block; font: 600 14px 'Instrument Sans', sans-serif; color: #FFFFFF">11:30pm</span>arrive by</span>
        <span><span style="display: block; font: 600 14px 'Instrument Sans', sans-serif; color: #FFFFFF">Side door</span>entrance</span>
        <span><span style="display: block; font: 600 14px 'Instrument Sans', sans-serif; color: #FFFFFF">Maya R.</span>your host</span>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
      <h2 style="margin: 0; font: 700 18px Archivo, sans-serif">Guest list</h2>
      <span style="font: 500 12px 'Instrument Sans', sans-serif; color: #5E5D58">{{countLabel}}</span>
    </div>
    <div style="border-radius: 22px; background: #FFFFFF; padding: 4px 14px; display: flex; flex-direction: column">
      <sc-for list="{{guests}}" as="g" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: {{g.line}}">
          <span style="width: 32px; height: 32px; border-radius: 50%; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 700 11px Archivo, sans-serif">{{g.initials}}</span>
          <span style="flex: 1; font: 600 14px 'Instrument Sans', sans-serif">{{g.name}}</span>
          <span style="font: 500 12px 'Instrument Sans', sans-serif; color: #5E5D58">{{g.status}}</span>
        </div>
      </sc-for>
    </div>
    <button onClick="{{addGuest}}" style="height: 46px; border-radius: 16px; border: 1.5px dashed #B5B2A8; background: transparent; font: 600 14px 'Instrument Sans', sans-serif; color: #111111; cursor: pointer">{{addLabel}}</button>
  </div>

  <div style="padding: 12px 20px 28px; display: flex; gap: 10px">
    <a href="NightOf.dc.html" style="flex: 1; height: 54px; border-radius: 999px; border: 1.5px solid #111111; display: flex; align-items: center; justify-content: center; font: 600 14px 'Instrument Sans', sans-serif">Rides &amp; tab</a>
    <button style="flex: 1; height: 54px; border-radius: 999px; border: 0; background: #111111; color: #FFFFFF; font: 600 14px 'Instrument Sans', sans-serif">Add to Wallet</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { extra: 0 };
  }
  renderVals() {
    const n = 17;
    const cells = [];
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        const finder = (cx, cy) => x >= cx && x < cx + 5 && y >= cy && y < cy + 5 && (x === cx || x === cx + 4 || y === cy || y === cy + 4 || (x === cx + 2 && y === cy + 2));
        const inFinderZone = (x < 6 && y < 6) || (x > 10 && y < 6) || (x < 6 && y > 10);
        let on;
        if (inFinderZone) on = finder(0, 0) || finder(12, 0) || finder(0, 12);
        else on = ((x * 7 + y * 13 + x * y) % 5) < 2;
        cells.push(on ? '#111111' : '#FFFFFF');
      }
    }
    const base = [
      ['PM', 'You (Priya)', 'Pass sent'],
      ['JL', 'Jess L.', 'Pass sent'],
      ['RK', 'Raj K.', 'Pass sent'],
      ['MT', 'Marcus T.', 'Pass sent'],
      ['TS', 'Tom S.', 'Pass sent']
    ];
    const extras = [['AB', 'Amira B.', 'Just added']];
    const list = base.concat(extras.slice(0, this.state.extra));
    return {
      cells: cells,
      guests: list.map((g, i) => ({ initials: g[0], name: g[1], status: g[2], line: i < list.length - 1 ? '1px solid #EEECE6' : '0' })),
      countLabel: list.length + ' of 10 spots used',
      addLabel: this.state.extra >= 1 ? '+ Add another guest' : '+ Add a guest',
      addGuest: () => this.setState({ extra: Math.min(1, this.state.extra + 1) })
    };
  }
}
</script>
</body>
</html>
